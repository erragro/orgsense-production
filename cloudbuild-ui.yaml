substitutions:
  _GITHUB_REPOSITORY: "erragro/orgsense-production"

steps:
  - name: 'python:3.12-slim'
    entrypoint: 'python'
    args: ['scripts/require_ci.py']
    env: ['GITHUB_REPOSITORY=${_GITHUB_REPOSITORY}', 'RELEASE_SHA=${COMMIT_SHA}']
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd kirana_kart_ui && npm ci && VITE_GOVERNANCE_API_URL=/api/governance VITE_INGEST_API_URL=/api/ingest npm run build'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-t'
      - 'asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/ui:${COMMIT_SHA}'
      - '-f'
      - 'kirana_kart_ui/Dockerfile'
      - 'kirana_kart_ui/'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/ui:${COMMIT_SHA}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'ui'
      - '--image=asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/ui:${COMMIT_SHA}'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--port=8080'
      - '--quiet'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: LEGACY
