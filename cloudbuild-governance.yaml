substitutions:
  _GITHUB_REPOSITORY: "erragro/orgsense-production"
  _MIGRATION_JOB: orgsense-migrate
  _IMAGE: 'asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/governance'

steps:
  - name: 'python:3.12-slim'
    entrypoint: 'python'
    args: ['scripts/require_ci.py']
    env: ['GITHUB_REPOSITORY=${_GITHUB_REPOSITORY}', 'RELEASE_SHA=${COMMIT_SHA}']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      # Tag with the commit SHA as well as :latest so a bad deploy can be
      # rolled back to a specific build instead of an unversioned pointer.
      - '-t'
      - '${_IMAGE}:${COMMIT_SHA}'
      - '-t'
      - '${_IMAGE}:latest'
      - '-f'
      - 'kirana_kart/Dockerfile'
      - 'kirana_kart/'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_IMAGE}']

  # Provision this job once with schema-owner credentials and DB connectivity.
  # Updating the image preserves those settings. Failure stops deployment.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args: ['gcloud', 'run', 'jobs', 'update', '${_MIGRATION_JOB}', '--image=${_IMAGE}:${COMMIT_SHA}', '--command=python', '--args=scripts/migrate.py', '--region=asia-south1', '--quiet']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args: ['gcloud', 'run', 'jobs', 'execute', '${_MIGRATION_JOB}', '--region=asia-south1', '--wait', '--quiet']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'governance'
      - '--image=${_IMAGE}:${COMMIT_SHA}'
      - '--region=asia-south1'
      - '--platform=managed'
      # DEPLOYMENT_ENV must be set explicitly: app/config.py now treats an
      # unset value as production, but being explicit keeps the intent visible
      # and keeps the tag correct on traces and metrics.
      - '--set-env-vars=DEPLOYMENT_ENV=production'
      # Every secret the app refuses to start without, plus the SELECT-only
      # role the BI Agent runs LLM-generated SQL as.
      - '--update-secrets=FRONTEND_URL=auralis-frontend-url:latest'
      - '--update-secrets=JWT_SECRET_KEY=auralis-jwt-secret:latest'
      - '--update-secrets=DB_PASSWORD=auralis-db-password:latest'
      - '--update-secrets=PII_ENCRYPTION_KEY=auralis-pii-encryption-key:latest'
      - '--update-secrets=BI_DB_USER=auralis-bi-db-user:latest'
      - '--update-secrets=BI_DB_PASSWORD=auralis-bi-db-password:latest'
      - '--quiet'

images:
  - '${_IMAGE}:${COMMIT_SHA}'
  - '${_IMAGE}:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: LEGACY
