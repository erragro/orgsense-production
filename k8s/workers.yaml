apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-beat
  namespace: auralis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker-beat
  template:
    metadata:
      labels:
        app: worker-beat
    spec:
      containers:
      - name: worker-beat
        image: asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/governance:RELEASE_REQUIRED
        command:
        - celery
        - -A
        - app.l4_agents.tasks
        - beat
        - --loglevel=info
        - --schedule=/tmp/celerybeat-schedule
        envFrom:
        - secretRef:
            name: auralis-env
        env:
        - name: DEPLOYMENT_ENV
          value: production
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
