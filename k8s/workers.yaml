apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-celery
  namespace: auralis
spec:
  replicas: 2
  selector: &id001
    matchLabels:
      app: worker-celery
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
      labels:
        app: worker-celery
    spec:
      containers:
      - name: worker
        image: asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/governance:RELEASE_REQUIRED
        command:
        - python
        - worker_health.py
        - celery
        - -A
        - app.l4_agents.tasks
        - worker
        - --loglevel=info
        - --concurrency=4
        - --queues=cardinal,celery
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          timeoutSeconds: 8
          periodSeconds: 10
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        envFrom:
        - secretRef:
            name: auralis-env
        env:
        - name: DEPLOYMENT_ENV
          value: production
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *id001
---
