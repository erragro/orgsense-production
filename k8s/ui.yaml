apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: auralis
spec:
  replicas: 2
  selector: &id001
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/ui:RELEASE_REQUIRED
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 250m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: auralis
spec:
  selector:
    app: ui
  ports:
  - port: 80
    targetPort: 8080
