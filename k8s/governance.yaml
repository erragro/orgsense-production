apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance
  namespace: auralis
spec:
  replicas: 2
  selector: &id001
    matchLabels:
      app: governance
  template:
    metadata:
      labels:
        app: governance
    spec:
      containers:
      - name: governance
        image: asia-south1-docker.pkg.dev/project-2d37241a-3276-4c0d-b31/auralis/governance:RELEASE_REQUIRED
        command:
        - uvicorn
        - app.admin.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8001'
        ports:
        - containerPort: 8001
        envFrom:
        - secretRef:
            name: auralis-env
        env:
        - name: DEPLOYMENT_ENV
          value: production
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 256Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: governance
  namespace: auralis
spec:
  selector:
    app: governance
  ports:
  - port: 8001
    targetPort: 8001
