apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: governance
  namespace: auralis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: governance
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest
  namespace: auralis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ingest
---
