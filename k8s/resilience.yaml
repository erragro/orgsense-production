---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: governance
  namespace: auralis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: governance
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
