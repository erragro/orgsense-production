services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_DB: orgintelligence
      POSTGRES_USER: orguser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orguser -d orgintelligence"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD} --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  weaviate:
    image: semitechnologies/weaviate:1.29.4
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY}"
      AUTHENTICATION_APIKEY_USERS: "kirana-kart-service"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  migrate:
    build:
      context: ./kirana_kart
    command: python scripts/migrate.py
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orgintelligence
      DB_USER: orguser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  governance:
    build:
      context: ./kirana_kart
    command: uvicorn app.admin.main:app --host 0.0.0.0 --port 8001
    env_file:
      - ./kirana_kart/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orgintelligence
      DB_USER: orguser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: kirana_kart
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      LLM_API_BASE_URL: https://api.openai.com/v1
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      PROMETHEUS_ENABLED: "true"
      OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "kirana-kart-governance"
      OTEL_SAMPLE_RATE: "0.1"
      DEPLOYMENT_ENV: development
      BI_DB_USER: bi_readonly
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_EXPIRE_MINUTES: "60"
      JWT_REFRESH_EXPIRE_DAYS: "30"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: "Super Admin"
      OAUTH_REDIRECT_BASE_URL: http://localhost:8001
      FRONTEND_URL: http://localhost:5173
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      DATA_REGION: "IN"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  ingest:
    build:
      context: ./kirana_kart
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./kirana_kart/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orgintelligence
      DB_USER: orguser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: kirana_kart
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      WEAVIATE_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      LLM_API_BASE_URL: https://api.openai.com/v1
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      PROMETHEUS_ENABLED: "true"
      OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "kirana-kart-ingest"
      OTEL_SAMPLE_RATE: "0.1"
      DEPLOYMENT_ENV: development
      # Required by app/config.py in every environment.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  worker-poll:
    build:
      context: ./kirana_kart
    command: python worker_health.py python -m app.l4_agents.worker
    env_file:
      - ./kirana_kart/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orgintelligence
      DB_USER: orguser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: kirana_kart
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      LLM_API_BASE_URL: https://api.openai.com/v1
      WEAVIATE_HOST: weaviate
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "kirana-kart-worker-poll"
      OTEL_SAMPLE_RATE: "0.1"
      DEPLOYMENT_ENV: development
      # Required by app/config.py in every environment.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  worker-celery:
    build:
      context: ./kirana_kart
    command: python worker_health.py celery -A app.l4_agents.tasks worker --loglevel=info --concurrency=2 --queues=cardinal,celery
    env_file:
      - ./kirana_kart/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: orgintelligence
      DB_USER: orguser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: kirana_kart
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      LLM_API_BASE_URL: https://api.openai.com/v1
      WEAVIATE_HOST: weaviate
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      OTLP_ENDPOINT: "http://otel-collector:4317"
      SERVICE_NAME: "kirana-kart-worker-celery"
      OTEL_SAMPLE_RATE: "0.1"
      DEPLOYMENT_ENV: development
      # Required by app/config.py in every environment.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  worker-beat:
    extends:
      service: worker-celery
    command: celery -A app.l4_agents.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  ui:
    build:
      context: ./kirana_kart_ui
    depends_on:
      governance:
        condition: service_healthy
      ingest:
        condition: service_healthy
    ports:
      - "5173:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Observability stack ───────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14250:14250"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - governance
      - ingest
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  pgdata:
  weaviate_data:
  prometheus_data:
  grafana_data:
